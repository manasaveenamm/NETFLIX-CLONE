name: Netflix CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: manasa6754
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: manasa6754/netflix-clone:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./netflix
           deploy-to-ec2:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$SSH_KEY_B64" | base64 --decode > "$HOME/netflix_github_actions"
          chmod 600 "$HOME/netflix_github_actions"

      - name: Test SSH connection
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh \
            -i "$HOME/netflix_github_actions" \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            "$EC2_USERNAME@$EC2_HOST" \
            "echo SSH connection successful"

      - name: Deploy application
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh \
            -i "$HOME/netflix_github_actions" \
            -o StrictHostKeyChecking=no \
            "$EC2_USERNAME@$EC2_HOST" << 'EOF'

          set -e

          echo "Connected to EC2"

          docker network inspect netflix-network >/dev/null 2>&1 || \
            docker network create netflix-network

          echo "Pulling backend..."
          docker pull manasa6754/netflix-clone:latest

          echo "Pulling frontend..."
          docker pull manasa6754/netflix-frontend:latest

          echo "Removing old containers..."
          docker rm -f netflix-frontend netflix-backend || true

          echo "Starting backend..."
          docker run -d \
            --name netflix-backend \
            --restart unless-stopped \
            --network netflix-network \
            --env-file /home/ubuntu/netflix-app/netflix2.0/.env \
            manasa6754/netflix-clone:latest

          echo "Starting frontend..."
          docker run -d \
            --name netflix-frontend \
            --restart unless-stopped \
            --network netflix-network \
            -p 80:80 \
            manasa6754/netflix-frontend:latest

          echo "Deployment completed"

          docker ps

          EOF push: true
          tags: manasa6754/netflix-frontend:latest


 
