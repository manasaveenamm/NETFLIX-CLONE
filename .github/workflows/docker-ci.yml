
name: Netflix CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
     
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: manasa6754
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: manasa6754/netflix-clone:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./netflix
          push: true
          tags: manasa6754/netflix-frontend:latest
  
  deploy-to-ec2:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/netflix-app/netflix2.0

            docker network inspect netflix-network >/dev/null 2>&1 || docker network create netflix-network

            docker pull manasa6754/netflix-clone:latest
            docker pull manasa6754/netflix-frontend:latest

            docker rm -f netflix-frontend netflix-backend || true

            docker run -d \
              --name netflix-backend \
              --restart unless-stopped \
              --network netflix-network \
              --env-file /home/ubuntu/netflix-app/netflix2.0/.env \
              manasa6754/netflix-clone:latest

            docker run -d \
              --name netflix-frontend \
              --restart unless-stopped \
              --network netflix-network \
              -p 80:80 \
              manasa6754/netflix-frontend:latest

            docker ps
 
  
